# ============================================================
#  «Умный светофор» MVP v1.0 — конфигурация системы
#  Файл: config.yaml
# ============================================================

# Режим работы:
#   test — тестовый режим по видеофайлу (.mp4)
#   live — боевой режим по камере (CSI/USB)
mode: test

# ---------- Источники видео ----------
video_path: "./test_video.mp4"     # путь к тестовому видео (режим test)
camera_source: 0                   # камера для live: 0 = /dev/video0 (USB),
                                   # либо путь "/dev/video1"; для CSI —
                                   # URL gstreamer (см. руководство)
video_loop: true                   # зацикливать видео при окончании
target_fps: 15                     # целевой темп обработки (0 = без троттлинга)

# ---------- Модель ИИ ----------
model_path: "./models/yolov8n-int8.tflite"  # TFLite int8 (640x640)
model_input_size: 640              # размер входа модели (квадрат)
conf_threshold: 0.35
iou_threshold: 0.45
allow_mock_fallback: true          # если модель не найдена — запустить
                                   # синтетический детектор (демо без ИИ)

# ---------- Визуализация ----------
show_video: true                   # показывать окно с кадрами (cv2.imshow)
window_scale: 1.0                  # масштаб окна (0.7 для слабых экранов)
phase_split_fraction: 0.5          # вертикальная граница между фазами A/B
                                   # (0.5 = левая/правая половины кадра)

# ---------- Коэффициенты вместимости (человек на 1 ТС) ----------
occupancy:
  pedestrian: 1.0
  passenger_car: 1.2
  bus: 35.0
  truck: 1.1
  motorcycle: 1.0
  bicycle: 1.0
  emergency_vehicle: 0.0   # спецтранспорт — событие, не входит в метрику PT

# ---------- Тайминги фаз, миллисекунды ----------
timings:
  min_green: 15000         # минимально-зелёный
  max_green: 60000         # максимально-зелёный
  amber: 3000              # жёлтый
  all_red_clearance: 2500  # очистка перекрёстка

# ---------- Пороги принятия решений ----------
thresholds:
  crowd_delta_ratio: 1.15      # во сколько раз фаза-конкурент должна «перевесить»
  min_waiting_to_switch: 2     # минимум объектов в очереди для переключения
  ev_confirm_frames: 2         # кадров подтверждения спецтранспорта (резерв)

# ---------- GPIO (релейный модуль), нумерация BCM ----------
# Реле активный LOW: реле срабатывает (замыкает) при LOW на входе IN.
gpio:
  pin_red_a: 17      # красный, фаза A
  pin_yellow_a: 27   # жёлтый, фаза A
  pin_green_a: 22    # зелёный, фаза A
  pin_red_b: 23      # красный, фаза B
  pin_yellow_b: 24   # жёлтый, фаза B
  pin_green_b: 25    # зелёный, фаза B
  relay_active_low: true   # реле активный LOW (срабатывает при логическом 0)
  relay: false              # принудительно выделять TTL/реальные реле (без pigpio)

# ---------- Логирование ----------
logging:
  level: "INFO"              # DEBUG | INFO | WARNING | ERROR
  file: "./logs/app.log"
